 <div class="ptab">
 <div class="card stack"><div class="sp"><h2>Stiker dino</h2><span class="muted">${mine.length} dari ${STICKERS.length}</span></div>
  ${mine.length ? `<div class="stk">${mine.slice(-8).reverse().map(x => stickerBtn(x)).join("")}</div>` : `<p class="muted">Belum ada stiker. Selesaikan 3 misi harian, lalu tetaskan telur dino di Beranda. Stiker langka didapat dari mengalahkan bos.</p>`}
  <button class="btn ghost" data-act="nav" data-v="stickers">${I("grid")}Lihat semua stiker</button></div>
 <div class="card stack"><div class="sp"><h2>Lencana</h2><span class="muted">${got.length} dari ${BADGES.length}</span></div>
  <div class="tierrow">${["b", "s", "g", "l"].map(t => `<span class="tier t-${t}"><b>${TIERN[t]}</b>${tierCount(t)}</span>`).join("")}</div>
  ${got.length ? `<div class="bgot">${got.slice(-10).reverse().map(b => `<span class="bchip t-${b.t}"><span class="bic on t-${b.t}">${I(b.ic)}</span><b>${b.n}</b></span>`).join("")}</div>` : `<p class="muted">Belum ada lencana. Ayo selesaikan pelajaran pertamamu!</p>`}
  ${near.length ? `<h3>Hampir didapat</h3><div class="stack" style="gap:10px">${near.map(badgeRow).join("")}</div>` : ""}
  <button class="btn ghost" data-act="allbadges">Lihat semua 40 lencana</button></div>
 </div>
 </div>`;
};

/* ================= LEMARI (24 per kategori, rarity) ================= */
let W = { tab: "char", sel: null };
function itemState(tab, x) {
 if (tab === "char") {
  if (x.boss !== undefined) return S.boss[LEVELS[x.boss].id] ? "own" : "lock";
  return x.p === 0 || S.owned["char:" + x.id] ? "own" : "buy";
 }
 if (x.r === "g") return S.badges[x.req] ? "own" : "lock";
 return x.p === 0 || S.owned[tab + ":" + x.id] ? "own" : "buy";
}
const lockWhy = (tab, x) => tab === "char" ? `Kalahkan bos ${LEVELS[x.boss].name} untuk membuka` : `Dapatkan lencana “${(BADGES.find(b => b.id === x.req) || {}).n}”`;
VIEWS.closet = () => {
 const tab = W.tab, isChar = tab === "char";
 const items = isChar ? CHARS : CLOSET[tab];
 const curId = isChar ? S.dino : S.look[tab], sel = W.sel ?? curId, it = items.find(x => x.id === sel) || items[0];
 const stt = itemState(tab, it), wearing = it.id === curId;
 const look = isChar ? S.look : Object.assign({}, S.look, { [tab]: it.id });
 const big = isChar ? charSVG(it.id, { look }) : charSVG(S.dino, { look });
 let foot;
 if (wearing) foot = `<button class="btn" disabled>${I("check")}Sedang dipakai</button>`;
 else if (stt === "own") foot = `<button class="btn" data-act="cwear">${isChar ? "Pilih " + esc(it.nick) : "Pakai " + esc(it.n)}</button>`;
 else if (stt === "lock") foot = `<button class="btn" disabled>${I("lock")}${lockWhy(tab, it)}</button>`;
 else if (S.coins >= it.p) foot = `<button class="btn sun" data-act="cbuy">${COIN}Beli · ${it.p} koin</button>`;
 else foot = `<button class="btn" disabled>Koin kurang · butuh ${it.p - S.coins} lagi</button>`;
 app.innerHTML = `<div class="closet">
 <div class="cstage card r-${it.r}"><div class="cbig">${big}</div>
  <div class="ctxt"><p class="eyebrow">Lemari ${esc(DN())} · <span class="rar r-${it.r}">${RARN[it.r]}</span></p><h1>${esc(isChar ? it.nick : it.n)}</h1>
  <span class="coinpill">${COIN}<b>${S.coins}</b> koin</span>
  <p class="muted chint">${isChar ? esc(it.n) : stt === "lock" ? "Barang legenda tidak bisa dibeli, hanya bisa dibuka dari prestasi." : "Ketuk barang untuk mencoba dulu."}</p>${foot}</div></div>
 <div class="cpick">
  <div class="seg scroll ctabs" role="tablist">${Object.keys(CATN).map(k => `<button role="tab" data-act="ctab" data-v="${k}" aria-selected="${tab === k}">${CATN[k]}</button>`).join("")}</div>
  <div class="cgrid">${items.map(x => { const s = itemState(tab, x), on = x.id === curId;
   const th = isChar ? charSVG(x.id, { look: S.look }) : charSVG(S.dino, { look: Object.assign({}, S.look, { [tab]: x.id }) });
   return `<button class="citem r-${x.r}${x.id === sel ? " sel" : ""}${s === "lock" ? " locked" : ""}" data-act="citem" data-v="${x.id}" aria-pressed="${x.id === sel}"><span class="cth">${th}</span><b>${esc(isChar ? x.nick : x.n)}</b>${on ? '<span class="wchip on">Dipakai</span>' : s === "own" ? '<span class="wchip own">Punya</span>' : s === "lock" ? `<span class="wchip lock">${I("lock")}${RARN[x.r]}</span>` : `<span class="wchip">${COIN}${x.p}</span>`}</button>`; }).join("")}</div>
 </div></div>`;
};

load();
render();

</script>
</body>
</html>
