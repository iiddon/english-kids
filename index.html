 <button class="btn" data-act="playchant">${I(CH.playing ? "x" : "play")}${CH.playing ? "Berhenti" : "Putar lagu"}</button>
 <div class="clines">${c.l.map((l, k) => `<button class="cline${CH.now === k ? " now" : ""}" data-act="cl" data-v="${k}"><span>${I("speaker")}</span><span><b>${esc(l[0])}</b><span>${esc(l[1])}</span></span></button>`).join("")}</div>
 <button class="clap" data-act="clap"><span class="em" aria-hidden="true">👏</span>Tepuk! <span aria-live="polite">${CH.claps}</span></button>
 <button class="btn leaf" data-act="chantdone">${I("check")}Aku sudah ikut bernyanyi</button></div>`;
};
function playChant() {
 const c = CHANTS.find(z => z.id === CH.id);
 if (CH.playing) { CH.playing = false; CH.now = -1; speechSynthesis && speechSynthesis.cancel(); render(); return; }
 CH.playing = true; let k = 0;
 const step = () => { if (!CH.playing || R.name !== "chant") return; if (k >= c.l.length) { CH.playing = false; CH.now = -1; render(); return; } CH.now = k; render(); speak(c.l[k][0], () => { k++; setTimeout(step, 350); }); };
 step();
}
/* ---------- cerita ---------- */
let ST = null;
VIEWS.story = id => {
 const s = STORIES.find(z => z.id === id); if (!s) return go("stories");
 ST = ST && ST.id === id ? ST : { id, p: 0, tr: false };
 const pg = s.p[ST.p], last = ST.p === s.p.length - 1;
 app.innerHTML = `<div class="stack" style="max-width:760px;margin:0 auto">${backBtn("stories", "Daftar cerita")}
 <div class="sp"><div><p class="eyebrow">${esc(s.e)}</p><h1 style="font-size:28px">${esc(s.t)}</h1></div><div class="pgdots" aria-label="Halaman ${ST.p + 1} dari ${s.p.length}">${s.p.map((z, k) => `<i class="${k === ST.p ? "on" : ""}"></i>`).join("")}</div></div>
 <div class="page">${pic(pg[0])}<p>${esc(pg[1])}</p>${ST.tr ? `<span class="tr">${esc(pg[2])}</span>` : ""}<div class="row" style="justify-content:center"><button class="spkbig sm" data-act="saypage" aria-label="Dengar kalimat">${I("speaker")}</button><button class="btn ghost auto" data-act="tr">${ST.tr ? "Sembunyikan arti" : "Lihat arti"}</button></div></div>
 <div class="pair"><button class="btn ghost" data-act="pg" data-v="-1" ${ST.p ? "" : "disabled"}>${I("back")}Sebelumnya</button>${last ? `<button class="btn leaf" data-act="storyq">Jawab pertanyaan</button>` : `<button class="btn" data-act="pg" data-v="1">Berikutnya</button>`}</div></div>`;
};
/* ---------- ujian ---------- */
VIEWS.tests = () => {
 app.innerHTML = `<div class="stack">${backBtn("practice")}<div class="greet">${REXI(64)}<div><h1>Ujian bintang</h1><p class="muted">12 soal dari satu level. Lulus 75% membuka level berikutnya dan memberi 50 fosil.</p></div></div>
 <div class="lst">${LEVELS.map((L, li) => { const op = levelOpen(li), sc = S.tests[L.id]; return `<button class="tool" data-act="test" data-v="${li}" style="--lv:${L.lv};--ldk:${L.ldk}" ${op ? "" : "disabled"}><span class="tic" style="background:var(--ldk);color:#fff">${I(op ? "trophy" : "lock")}</span><span><b>${L.name}</b><small>${L.grade} · ${L.desc}</small></span><span class="meta">${sc != null ? sc + "%" : op ? "Belum" : "Terkunci"}</span></button>`; }).join("")}</div></div>`;
};
/* ---------- sudut orang tua ---------- */
let PG = null;
VIEWS.parent = () => {
 if (!PG || !PG.ok) {
  PG = PG || { a: 3 + Math.floor(Math.random() * 7), b: 4 + Math.floor(Math.random() * 6) };
  app.innerHTML = `<div class="stack parentgate">${backBtn("practice")}<div class="card stack" style="text-align:center"><h1 style="font-size:28px">Sudut Orang Tua & Guru</h1><p class="muted">Untuk orang dewasa. Jawab dulu soal ini:</p><p style="font:700 40px/1 var(--display)">${PG.a} × ${PG.b} = ?</p>
  <input id="pgin" class="namefield" type="text" inputmode="numeric" autocomplete="off" aria-label="Jawaban"><button class="btn" data-act="pgok">Masuk</button><p class="muted danger" id="pgerr" role="status"></p></div></div>`;
  return;
 }
 const days = [...Array(7)].map((_, k) => { const d = new Date(); d.setDate(d.getDate() - (6 - k)); const r = S.days[dkey(d)] || { q: 0 }; return { n: DAYN[d.getDay()], q: r.q }; });
 const mx = Math.max(10, ...days.map(d => d.q));
 const acc = S.ans ? Math.round(S.cor / S.ans * 100) : 0;
 app.innerHTML = `<div class="stack" style="max-width:1000px;margin:0 auto">${backBtn("practice")}
 <h1>Sudut Orang Tua & Guru</h1>
 <div class="ptab"><div class="stack">
  <dl class="statgrid"><div><dt>Pelajaran selesai</dt><dd>${doneCount()}/${LESSONS.length}</dd></div><div><dt>Ketepatan</dt><dd>${acc}%</dd></div><div><dt>Kata hafal</dt><dd>${knownCount()}</dd></div><div><dt>Rekor beruntun</dt><dd>${S.best} hr</dd></div></dl>
  <div class="card stack"><h2>Soal dijawab, 7 hari terakhir</h2><div class="week">${days.map(d => `<div><em>${d.q}</em><i class="${d.q >= 10 ? "hit" : ""}" style="height:${Math.max(6, d.q / mx * 100)}%"></i><span>${d.n}</span></div>`).join("")}</div><p class="muted">Batang hijau: 10 soal atau lebih pada hari itu.</p></div>
  <div class="card lvp"><h2>Progres per level</h2>${LEVELS.map((L, li) => { const dn = L.lessons.filter(x => S.done[x.id]).length; return `<div class="lvp-r" style="--lv:${L.lv};--ldk:${L.ldk}"><span class="roundel sm">${li + 1}</span><span><b>${L.name} · ${L.grade}</b><span class="skbar"><i style="width:${dn / L.lessons.length * 100}%"></i></span></span><span class="muted" style="font-weight:800">${dn}/${L.lessons.length}${S.tests[L.id] != null ? " · uji " + S.tests[L.id] + "%" : ""}</span></div>`; }).join("")}</div>
 </div><div class="stack">
  <div class="card"><h2>Pengaturan belajar</h2>
   <div class="setting" style="display:grid"><b>Kelas / level awal</b><div class="grades" style="margin-top:8px">${LEVELS.map((L, i) => `<button class="grade${S.start === i ? " on" : ""}" data-act="setstart" data-v="${i}" aria-pressed="${S.start === i}"><b>${L.grade}</b><span>${L.name}</span></button>`).join("")}</div></div>
   <div class="setting"><span><b>Buka semua level</b><br><small class="muted">Anak bebas memilih pelajaran mana saja</small></span><label class="switch"><input type="checkbox" data-input="allOpen" ${S.allOpen ? "checked" : ""}><span>${S.allOpen ? "Nyala" : "Mati"}</span></label></div>
  </div>
  <div class="card stack"><h2>Pindah ke perangkat lain</h2><p class="muted">Salin kode ini, lalu tempel di aplikasi pada iPad, HP, atau laptop lain.</p>
   <textarea id="exp" rows="3" readonly aria-label="Kode progres">${esc(exportCode())}</textarea>
   <div class="pair"><button class="btn ghost" data-act="copycode">${I("copy")}Salin kode</button><button class="btn ghost" data-act="importcode">Tempel kode</button></div></div>
  <div class="card stack"><h2>Mulai dari awal</h2><p class="muted">Menghapus semua progres, fosil, stiker, dan lencana di perangkat ini.</p><button class="btn bad" data-act="reset">${I("trash")}Hapus semua progres</button></div>
 </div></div></div>`;
};
const exportCode = () => { try { return "EK1." + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) { return ""; } };

/* ================= AKSI ================= */
const ACT = {
 nav: v => go(v), home: () => go(S.onb ? "home" : "welcome"),
 grade: v => { const n = $("#nm"); if (n) S.name = n.value.trim(); R.arg = +v; render(); },
 startapp: () => { const n = $("#nm"); S.name = (n && n.value.trim()) || ""; S.start = R.arg; S.onb = 1; save(); go("home"); },
 lesson: v => { const x = LESSONS.find(l => l.id === v); if (x && lessonOpen(x)) go("lesson", v); },
 hearw: (v, b) => { const x = LESSONS.find(l => l.id === R.arg); hear(x.words[+v].w); b.classList.add("played"); },
 hears: v => { const x = LESSONS.find(l => l.id === R.arg); hear(x.sents[+v].full); },
 startlesson: v => { const x = LESSONS.find(l => l.id === v); startQuiz({ kind: "lesson", lid: v, qs: lessonQs(x), back: "home" }); },
 sel: v => {
  const now = Date.now(); if (Q.locked || now - lastTap < 250) return; lastTap = now;
  const o = cur().opts[+v]; Q.sel = o.v; SFX.tap(); if (o.sayOpt) speak(o.sayOpt); render();
 },
 place: v => { if (Q.locked || Q.placed.includes(+v)) return; Q.placed.push(+v); SFX.tap(); render(); },
 unplace: v => { if (Q.locked) return; Q.placed.splice(+v, 1); render(); },
 lock: () => lockAnswer(), nextq: () => nextQ(),
 sayq: () => { const q = cur(); if (q.say) hear(q.say); },
 sayans: () => { const q = cur(); speak(q.after || q.show.w); },
 quitq: () => sheet(`<div class="sheet-h"><h2>Keluar dari kuis?</h2></div><p class="muted">Jawaban di kuis ini belum disimpan sebagai pelajaran selesai.</p><div class="pair"><button class="btn ghost" data-act="close">Lanjut main</button><button class="btn bad" data-act="quitok">Keluar</button></div>`, "Keluar dari kuis"),
 quitok: () => { closeSheet(); const b = Q.back || "home"; Q = null; go(b); },
 close: () => closeSheet(),
 again: () => { const o = Q; if (o.kind === "lesson") return ACT.startlesson(o.lid); if (o.kind === "test") return ACT.test(o.li); if (o.kind === "story") return ACT.storyq(); startQuiz({ kind: o.kind, qs: o.remake(), remake: o.remake, back: o.back }); },
 afterres: () => { if (Q.kind === "lesson") { const n = nextLesson(); Q = null; return n ? go("lesson", n.id) : go("home"); } const b = Q.back || "home"; Q = null; go(b); },
 daily: () => { const mk = () => mixedQs(pool(), 10); startQuiz({ kind: "daily", qs: mk(), remake: mk, back: "practice" }); },
 picq: () => { const mk = () => mixedQs(pool().filter(w => !w.pic.startsWith("t:")), 8, "word"); startQuiz({ kind: "picq", qs: mk(), remake: mk, back: "practice" }); },
 hearq: () => { const mk = () => mixedQs(pool(), 8, "hear").map(q => q.type === "hear" ? q : makeQ("hear", WMAP[q.key])); startQuiz({ kind: "hearq", qs: mk(), remake: mk, back: R.name === "home" ? "home" : "practice" }); },
 review: () => { const ks = wrongDue(); if (!ks.length) return; const mk = () => shuffle(wrongDue().length ? wrongDue() : ks).slice(0, 10).map(k => itemQ(WMAP[k], WMAP[k].li)); startQuiz({ kind: "review", qs: mk(), remake: mk, back: "practice" }); },
 tests: () => go("tests"),
 test: v => { const li = +v; if (!levelOpen(li)) return; const L = LEVELS[li]; const items = L.lessons.flatMap(x => x.words.concat(x.sents)); startQuiz({ kind: "test", li, qs: shuffle(items).slice(0, 12).map(it => itemQ(it, li)), back: R.name === "tests" ? "tests" : "home" }); },
 flash: () => { F = { deck: shuffle(pool()).slice(0, 12), i: 0, on: false, k: 0 }; go("flash"); },
 flip: () => { F.on = !F.on; render(); if (F.on) hear(F.deck[F.i].w); },
 fk: v => { const w = F.deck[F.i]; if (+v) { S.known[w.w] = Math.max(3, S.known[w.w] || 0); F.k++; SFX.ok(); } F.i++; F.on = false; if (F.i >= F.deck.length) { today().g++; addFosil(10); touchDay(); checkBadges(); } save(); render(); },
 match: () => { const ws = []; shuffle(pool()).forEach(w => { if (ws.length < 6 && !ws.some(z => z.w === w.w || z.pic === w.pic)) ws.push(w); }); M = { items: ws, left: shuffle(ws), right: shuffle(ws), gone: [], sel: null, t0: 0, miss: 0 }; go("match"); },
 mt: v => {
  const [side, k] = v.split(":"), it = (side === "L" ? M.left : M.right)[+k];
  if (!M.t0) M.t0 = Date.now(); M.bad = null;
  if (side === "R") speak(it.w);
  if (!M.sel || M.sel.side === side) { M.sel = { side, k: +k, it }; SFX.tap(); return render(); }
  if (M.sel.it.w === it.w) { M.gone.push(it.w); M.sel = null; SFX.ok(); speak(it.w);
   if (M.gone.length === M.items.length) { M.time = Math.round((Date.now() - M.t0) / 1000); M.rec = !S.matchBest || M.time < S.matchBest; if (M.rec) S.matchBest = M.time; addFosil(20); today().g++; touchDay(); save(); SFX.win(); confetti(); checkBadges(); }
  } else { M.miss++; M.bad = side + k; M.sel = null; SFX.no(); }
  render();
 },
 say: () => { SY = { deck: shuffle(pool()).slice(0, 5), i: 0, ok: 0, res: null, heard: "" }; go("say"); },
 sayw: () => hear(SY.deck[SY.i].w),
 mic: () => {
  if (!SR) return;
  if (SY.on) { stopRec(); return render(); }
  try {
   speechSynthesis && speechSynthesis.cancel();
   REC = new SR(); REC.lang = "en-US"; REC.interimResults = false; REC.maxAlternatives = 5;
   SY.on = true; SY.res = null; SY.heard = ""; render();
   REC.onresult = e => { const target = norm(SY.deck[SY.i].w); const alts = [...e.results[0]].map(a => norm(a.transcript)); SY.heard = alts[0] || "";
    const ok = alts.some(a => a.includes(target) || lev(a, target) <= Math.max(1, Math.floor(target.length / 4)));
    SY.on = false; REC = null; if (ok) sayOk(); else { SY.res = false; SFX.no(); render(); } };
   REC.onerror = () => { SY.on = false; REC = null; SY.heard = ""; render(); toast("Mikrofon belum bisa dipakai. Izinkan mikrofon, atau ketuk “Aku sudah mengucapkannya”."); };
   REC.onend = () => { if (SY && SY.on) { SY.on = false; REC = null; render(); } };
   REC.start();
  } catch (e) { SY.on = false; render(); }
 },
 sayself: () => sayOk(),
 saynext: () => { SY.i++; SY.res = null; SY.heard = ""; if (SY.i >= SY.deck.length) { today().g++; save(); checkBadges(); } render(); },
 chants: () => go("chants"), stories: () => go("stories"),
 chant: v => { CH = null; go("chant", v); },
 playchant: () => playChant(),
 cl: v => { const c = CHANTS.find(z => z.id === CH.id); CH.playing = false; CH.now = +v; render(); hear(c.l[+v][0]); },
 clap: (v, b) => { CH.claps++; tone([[880, .05, "square", .05]]); const s = b.querySelector("[aria-live]"); if (s) s.textContent = CH.claps; b.classList.remove("hit"); void b.offsetWidth; b.classList.add("hit"); },
 chantdone: () => { const first = !S.sang[CH.id]; S.sang[CH.id] = 1; today().g++; if (first) addFosil(10); touchDay(); save(); toast(first ? "Hebat! +10 fosil" : "Hebat, kamu bernyanyi lagi!"); checkBadges(); go("chants"); },
 story: v => { ST = null; go("story", v); setTimeout(() => ACT.saypage(), 400); },
 saypage: () => { const s = STORIES.find(z => z.id === ST.id); hear(s.p[ST.p][1]); },
 tr: () => { ST.tr = !ST.tr; render(); },
 pg: v => { const s = STORIES.find(z => z.id === ST.id); ST.p = Math.max(0, Math.min(s.p.length - 1, ST.p + +v)); render(); ACT.saypage(); },
 storyq: () => { const s = STORIES.find(z => z.id === (ST ? ST.id : Q.sid)); const qs = s.q.map(q => { const o = shuffle(q.o.map((p, k) => ({ pic: p, v: k }))); return { type: "story", say: q.q, id: q.id, opts: o, a: q.a, two: q.o.length === 2, show: null }; }); startQuiz({ kind: "story", sid: s.id, qs, back: "stories" }); },
 egg: () => {
  if (!(missionsDone() && S.egg !== dkey())) { toast(S.egg === dkey() ? "Telur hari ini sudah menetas. Datang lagi besok!" : "Selesaikan 3 misi dulu, ya."); return; }
  const left = STICKERS.filter(s => !S.stickers[s[0]]); const s = left.length ? pick(left) : pick(STICKERS);
  S.stickers[s[0]] = dkey(); S.egg = dkey(); addFosil(50); save(); SFX.win(); confetti();
  sheet(`<div class="hatch"><span class="big" aria-hidden="true">${s[0]}</span><h2>Telurnya menetas!</h2><p class="muted" style="font-weight:800">Kamu dapat stiker <b>${esc(s[1])}</b> dan 50 fosil.</p></div><button class="btn" data-act="closeh">Asyik!</button>`, "Telur menetas");
  checkBadges();
 },
 closeh: () => { closeSheet(); render(); },
 rate: v => { S.rate = v; save(); render(); speak("Hello! I am Rexi."); },
 parent: () => { PG = null; go("parent"); },
 pgok: () => { const v = +($("#pgin").value || "").trim(); if (v === PG.a * PG.b) { PG.ok = true; render(); } else { $("#pgerr").textContent = "Jawaban belum tepat. Coba lagi."; } },
 setstart: v => { S.start = +v; save(); render(); toast("Level awal diubah ke " + LEVELS[+v].grade); },
 copycode: () => { const t = $("#exp"); t.select(); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast("Kode disalin."), () => { try { document.execCommand("copy"); toast("Kode disalin."); } catch (e) { toast("Pilih teksnya lalu salin manual."); } }); },
 importcode: () => sheet(`<div class="sheet-h"><h2>Tempel kode progres</h2></div><p class="muted">Progres di perangkat ini akan diganti dengan progres dari kode.</p><textarea id="imp" rows="4" aria-label="Kode progres"></textarea><div class="pair"><button class="btn ghost" data-act="close">Batal</button><button class="btn" data-act="importok">Pakai kode</button></div>`, "Tempel kode"),
 importok: () => { try { const v = $("#imp").value.trim().replace(/^EK1\./, ""); const o = JSON.parse(decodeURIComponent(escape(atob(v)))); if (typeof o !== "object" || !o) throw 0; S = Object.assign(fresh(), o); S.onb = 1; save(); closeSheet(); toast("Progres berhasil dipindahkan."); render(); } catch (e) { toast("Kode tidak bisa dibaca. Pastikan tersalin lengkap."); } },
 reset: () => sheet(`<div class="sheet-h"><h2>Hapus semua progres?</h2></div><p class="muted">Fosil, stiker, lencana, dan pelajaran yang selesai akan hilang dari perangkat ini. Tindakan ini tidak bisa dibatalkan.</p><div class="pair"><button class="btn ghost" data-act="close">Batal</button><button class="btn bad" data-act="resetok">Ya, hapus</button></div>`, "Hapus progres"),
 resetok: () => { S = fresh(); save(); closeSheet(); PG = null; go("welcome"); }
};

document.addEventListener("click", e => {
 const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
 const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset.v, b); }
});
document.addEventListener("change", e => {
 const t = e.target.closest("[data-input]"); if (!t) return;
 const k = t.dataset.input;
 if (k === "name") S.name = t.value.trim();
 else { S[k] = t.checked; }
 save(); if (k !== "name") render(); else renderTop();
});
document.addEventListener("keydown", e => {
 if (e.key === "Escape" && document.querySelector(".modal")) return closeSheet();
 if (R.name !== "quiz" || !Q || document.querySelector(".modal") || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
 const q = cur();
 if (!Q.locked && q.opts && /^[1-4]$/.test(e.key) && +e.key <= q.opts.length) { ACT.sel(String(+e.key - 1)); }
 else if (e.key === "Enter") { e.preventDefault(); if (Q.locked) nextQ(); else lockAnswer(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "pgin") ACT.pgok(); });

load();
render();

</script>
</body>
</html>
