<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English for Kids — Belajar Bahasa Inggris bersama Rexi</title>
<meta name="description" content="Belajar bahasa Inggris untuk anak TK dan SD bersama Rexi si dinosaurus: kosakata bergambar, dengar & ucapkan, cerita, lagu, misi harian. Gratis, tanpa daftar.">
<meta name="theme-color" content="#e7dcff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Kids">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* English for Kids — tema Dunia Dinosaurus: krem pasir, oranye tanah, hijau daun.
     Struktur komponen sama dengan English Path ("Lembut & Ceria"), token warna diganti. */
  --bg:#fbf4e4; --surface:#ffffff; --soft:#f6eedb; --line:#e8dbbd;
  --ink:#33281a; --muted:#6b5c45;
  --primary:#c4561a; --primary-d:#943d0e; --primary-l:#fde4d3;
  --sun:#ffc845; --sun-d:#d9a21f; --sun-l:#fff2cc;
  --coral:#ff7a59; --coral-d:#d9583a; --coral-l:#ffe3d8;
  --mint:#34c79a; --mint-d:#21a37b; --mint-l:#dff2cf;
  --leaf:#5aa83f; --leaf-d:#3f8a2a; --leaf-l:#e2f4cf;
  --lilac-l:#ece6ff;
  --sun-s:#f3dc94; --coral-s:#f6c6b3; --mint-s:#c4e3a8; --lilac-s:#d6ccfa;
  --good-ink:#127a55; --good-deep:#0f5c41; --bad-ink:#b3401f; --bad-deep:#8f2f14;
  --sub-ink:#4a3d2a; --dash:#d4c39c; --fire-ink:#c2410c; --xp-ink:#7a5500; --glass:rgba(255,255,255,.72);
  --sh:0 4px 0 var(--line); --sh-lg:0 6px 0 var(--line);
  --r:20px; --r-lg:26px;
  --display:"Gluten","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:600 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
a{color:var(--primary-d)}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- soft 3D press ---------- */
.pop{box-shadow:var(--sh);transition:transform .1s ease-out,box-shadow .1s ease-out}
.pop:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* ---------- shell ---------- */
.shell{max-width:1040px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(116px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;min-height:44px;white-space:nowrap;font:700 21px/1 var(--display)}
.brand .wm{overflow:hidden;text-overflow:ellipsis}
.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--sun);box-shadow:0 3px 0 var(--sun-d);font:700 15px/1 var(--display);color:var(--ink)}
.chips{display:flex;gap:8px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:99px;background:var(--surface);box-shadow:0 3px 0 var(--line);font:800 15px/1 var(--body);font-variant-numeric:tabular-nums}
.chip .ic{fill:#ff8a3d;stroke:#ff8a3d;stroke-width:1.5;color:#e8590c}
.chip:first-child{color:var(--fire-ink)}
.chip.xp{color:var(--xp-ink)}
.chip.xp .ic{fill:var(--sun);stroke:var(--sun-d);stroke-width:1.5}
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;display:flex;gap:4px;padding:6px;border-radius:99px;background:var(--surface);box-shadow:0 6px 0 var(--line),0 10px 28px rgba(36,38,74,.14)}
.nav button{display:flex;align-items:center;gap:7px;height:48px;padding:0 18px;border-radius:99px;color:var(--muted);font:800 15px/1 var(--body);white-space:nowrap}
.nav button .ic{width:22px;height:22px}
.nav button[aria-current="page"]{background:var(--primary-l);color:var(--primary-d)}
@media (max-width:560px){.nav button:not([aria-current="page"]) .t{display:none}.nav button{padding:0 15px}}
@media (max-width:420px){.brand{font-size:19px}.chip{padding:7px 10px;font-size:14px}}
body.focus .top,body.focus .nav{display:none}
body.focus .shell{padding-bottom:32px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:none;z-index:9}

/* ---------- type ---------- */
h1{font:700 32px/1.1 var(--display);letter-spacing:-.01em;text-wrap:balance}
h2{font:600 22px/1.15 var(--display);text-wrap:balance}
h3{font:800 16px/1.3 var(--body);margin:18px 0 6px}
.eyebrow{font:700 14px/1.3 var(--body);color:var(--muted)}
.muted{color:var(--muted);font-size:15px}
.num{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums}
.stack{display:grid;gap:16px}
.stack>*,.home>*{min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.narrow{max-width:680px}
.tag{display:inline-flex;align-self:flex-start;padding:5px 12px;border-radius:99px;background:var(--soft);font:800 13px/1.2 var(--body);color:var(--ink)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:10px 20px;border-radius:18px;background:var(--primary);box-shadow:0 5px 0 var(--primary-d);color:#fff;font:600 19px/1.1 var(--display);text-align:center;transition:transform .1s ease-out,box-shadow .1s ease-out}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--primary-d)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none}
.btn.lv{background:var(--primary);color:#fff}
.btn.blue{background:var(--primary);color:#fff}
.btn.good{background:var(--mint);box-shadow:0 5px 0 var(--mint-d);color:#fff}
.btn.good:active:not(:disabled){box-shadow:0 1px 0 var(--mint-d)}
.btn.bad{background:var(--coral);box-shadow:0 5px 0 var(--coral-d);color:#fff}
.btn.bad:active:not(:disabled){box-shadow:0 1px 0 var(--coral-d)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn.auto{width:auto}
.iconbtn{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:var(--surface);box-shadow:0 3px 0 var(--line);color:var(--muted);flex:none;font-size:20px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 10px 8px 0;font:800 15px/1 var(--body);color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-lg)}
.seg{display:flex;gap:4px;padding:5px;border-radius:18px;background:var(--surface);box-shadow:0 3px 0 var(--line)}
.seg button{flex:1 1 auto;min-width:44px;min-height:44px;overflow:hidden;text-overflow:ellipsis;padding:10px 8px;border-radius:13px;font:800 15px/1 var(--body);color:var(--muted);text-align:center;white-space:nowrap}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:1 0 auto;overflow:visible;padding:10px 12px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--primary-l);color:var(--primary-d)}
.spk{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--primary-l);color:var(--primary-d);font-size:18px;flex:none}
.spk:active{background:var(--primary);color:#fff}

/* ---------- mascot ---------- */
.bubu{flex:none;display:block}
.bubu.wave{animation:wave 2.6s ease-in-out infinite;transform-origin:50% 90%}
.greet{display:flex;align-items:flex-end;gap:10px}
.greet .say{flex:1;min-width:0;padding:12px 16px;border-radius:20px 20px 20px 6px;background:var(--surface);box-shadow:var(--sh)}
.greet .say b{display:block;font:700 25px/1.15 var(--display)}
.greet .say span{color:var(--muted);font-size:15px}

/* ---------- home ---------- */
.home{display:grid;gap:22px}
.cont{display:flex;flex-direction:column;gap:12px;width:100%;padding:20px;border-radius:var(--r-lg);background:var(--primary);color:#fff;box-shadow:0 7px 0 var(--primary-d);text-align:left;transition:transform .1s ease-out,box-shadow .1s ease-out}
.cont:active{transform:translateY(5px);box-shadow:0 2px 0 var(--primary-d)}
.cont .tag{background:rgba(255,255,255,.2);color:#fff}
.cont .t{font:700 34px/1.05 var(--display);text-wrap:balance}
.cont .go{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cont .play{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--sun);box-shadow:0 4px 0 var(--sun-d);color:var(--ink);flex:none}
.cont .play .ic{fill:var(--ink);width:24px;height:24px}
.cont small{color:#fff;font-weight:700}
.pbar{flex:1;height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.cont .pbar{background:rgba(255,255,255,.25)}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--sun)}
.mission{display:grid;gap:12px}
.mission-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.mrow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center}
.mbox{display:grid;place-items:center;width:34px;height:34px;border:3px solid var(--line);border-radius:50%;background:var(--surface);color:#fff}
.mbox .ic{stroke-width:3.6;width:17px;height:17px}
.mrow.done .mbox{background:var(--mint);border-color:var(--mint)}
.mrow.done .mt{text-decoration:line-through;color:var(--muted)}
.mt{font-weight:700}
.mrow .pbar{height:9px;margin-top:6px}
.mrow .pbar i{background:var(--coral)}
.mn{font:800 15px/1 var(--body);font-variant-numeric:tabular-nums}
.chest{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--soft);text-align:left}
.chest .ic{width:30px;height:30px;color:var(--sun-d)}
.chest.ready{background:var(--sun-l);box-shadow:0 4px 0 var(--sun-s);animation:wiggle 1.4s ease-in-out infinite}
.chest.ready:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-s);animation:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:22px;background:var(--tc,var(--surface));box-shadow:0 4px 0 var(--ts,var(--line));text-align:left;transition:transform .1s ease-out,box-shadow .1s ease-out}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ts,var(--line))}
.tile:disabled{background:var(--soft);box-shadow:none}
.tile:disabled .ic{background:var(--line);color:var(--muted)}
.tile .ic{width:42px;height:42px;padding:10px;border-radius:14px;background:var(--ti,var(--primary));color:#fff}
.tile b{font:600 18px/1.15 var(--display)}
.tile small{font-size:13.5px;font-weight:700;color:var(--muted)}
.secthead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:8px}
.levels{display:grid;gap:14px}
.lvcard{border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-lg);overflow:hidden}
.lv-h{display:flex;gap:14px;align-items:center;min-height:76px;padding:14px 16px;background:var(--lv);cursor:pointer;list-style:none;user-select:none}
.lv-h::-webkit-details-marker{display:none}
.lv-h .lv-t{flex:1;min-width:0;display:grid;gap:3px}
.lv-n{font:600 19px/1.15 var(--display)}
.lv-s{font:700 13.5px/1.2 var(--body);color:var(--sub-ink)}
.lvbar{height:8px;margin-top:4px;border-radius:99px;background:var(--glass);overflow:hidden}
.lvbar i{display:block;height:100%;border-radius:99px;background:var(--ldk)}
.chev{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--glass);flex:none;transition:transform .2s}
.chev .ic{width:20px;height:20px;stroke-width:3}
details[open] .chev{transform:rotate(180deg)}
.lvcard.done .roundel{background:var(--ldk);color:#fff}
.lvcard.done .roundel .ic{width:24px;height:24px;stroke-width:3.4}
.lvcard.cur{box-shadow:0 6px 0 var(--line),0 0 0 3px var(--sun)}
.lv-d{padding:12px 16px 4px;font-size:14.5px;font-weight:700;color:var(--muted)}
.lvcard:not([open]) .lv-h:hover{filter:brightness(.98)}
.roundel{display:grid;place-items:center;width:50px;height:50px;border-radius:16px;background:var(--surface);box-shadow:0 3px 0 rgba(36,38,74,.1);font:700 19px/1 var(--display);flex:none}
.roundel.sm{width:38px;height:38px;font-size:15px;border-radius:12px}
.count{font:700 21px/1 var(--display);font-variant-numeric:tabular-nums}
.lrows{list-style:none;display:grid}
.lrow{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 16px;border-bottom:2px solid var(--soft);text-align:left}
li:last-child .lrow{border-bottom:0}
.lrow:hover{background:var(--soft)}
.lrow .n{display:grid;place-items:center;width:42px;height:42px;border:3px solid var(--line);border-radius:50%;background:var(--surface);font:700 17px/1 var(--display);color:var(--muted)}
.lrow b{display:block;font-weight:800;font-size:17px}
.lrow small{color:var(--muted);font-size:13.5px;font-weight:700}
.lrow.done .n{background:var(--ldk,var(--mint));border-color:var(--ldk,var(--mint));color:#fff}
.lrow.cur{background:var(--sun-l)}
.lrow.cur .n{background:var(--sun);border-color:var(--sun);color:var(--ink);animation:pulse 1.6s infinite}
.lrow .go{font:800 13px/1 var(--body);padding:8px 12px;border-radius:99px;background:var(--primary);color:#fff}
.lrow.test .n{border-radius:14px;border-color:var(--ink);background:var(--ink);color:#fff}
.lrow.test.done .n{background:var(--ldk,var(--mint));border-color:var(--ldk,var(--mint))}
.allbar{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.allbar span{height:12px;border-radius:99px;background:var(--surface);box-shadow:0 2px 0 var(--line);overflow:hidden}
.allbar i{display:block;height:100%;border-radius:99px;background:var(--ldk,var(--primary))}
@media (min-width:920px){
  .home{grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
  .home .side{position:sticky;top:16px;order:2}
  h1{font-size:40px}
}

/* ---------- rings (result) ---------- */
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .tr{stroke:var(--soft)}
.ring .fg{stroke:var(--primary);transition:stroke-dashoffset .6s}
.ring .lab{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lab b{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.ring .lab span{font:700 11px/1.2 var(--body);color:var(--muted)}
.ring.big{width:136px;height:136px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-lg)}
.ring.big .lab b{font-size:36px}

/* ---------- practice hub ---------- */
.tools{display:grid;gap:12px}
.tool{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px;border-radius:22px;background:var(--surface);box-shadow:var(--sh);width:100%;text-align:left;transition:transform .1s ease-out,box-shadow .1s ease-out}
.tool:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tool .tic{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--ldk,var(--primary));color:#fff;font-size:21px}
.tool b{display:block;font:600 18px/1.2 var(--display)}
.tool small{color:var(--muted);font-size:14px;font-weight:700}
.tool .meta{font:800 13px/1 var(--body);padding:7px 11px;border-radius:99px;background:var(--soft);white-space:nowrap}
.tool:disabled{background:var(--soft);box-shadow:none}
.tool:disabled .tic{background:var(--line);color:var(--muted)}

/* ---------- lesson ---------- */
.lesson-h{display:flex;gap:14px;align-items:center;margin:6px 0 18px}
.lesson-h .roundel{background:var(--lv)}
.theory{overflow-x:auto}
.theory p{margin-bottom:10px}
.theory ul{padding-left:20px;margin:6px 0 12px}
.theory li{margin-bottom:5px}
.theory table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:15px}
.theory th{font:800 13px/1.2 var(--body);color:var(--muted);text-align:left}
.theory td,.theory th{padding:9px 10px 9px 0;border-bottom:2px solid var(--soft);vertical-align:top}
.formula{margin:10px 0 14px;padding:12px 16px;border-radius:16px;background:var(--lv,var(--primary-l));font-weight:800}
.ex{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:2px solid var(--soft)}
.ex:last-child{border-bottom:0}
.ex b{display:block;font-weight:800;font-size:17px}
.ex span{color:var(--muted);font-size:15px}
.types{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.types li{padding:7px 12px;border-radius:99px;background:var(--lv,var(--primary-l));font:800 13px/1 var(--body)}

/* ---------- quiz ---------- */
.quiz{max-width:640px;margin:0 auto}
.qbar{display:flex;align-items:center;gap:10px;margin:2px 0 22px}
.blocks{flex:1;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px}
.blocks span{height:14px;border-radius:99px;background:var(--line);transition:background .2s}
.blocks span.ok{background:var(--mint)}
.blocks span.no{background:repeating-linear-gradient(135deg,var(--coral) 0 4px,#fff 4px 7px)}
.blocks span.cur{background:var(--sun)}
.prog{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .35s}
.qcount{font:800 15px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.combo{padding:6px 11px;border-radius:99px;background:var(--coral-l);color:var(--bad-ink);font:800 14px/1 var(--body);white-space:nowrap;animation:pop .3s}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:18px;border-radius:20px;background:var(--surface);box-shadow:var(--sh);font-weight:700}
.qtext{font:600 27px/1.25 var(--display);margin:10px 0 20px;text-wrap:pretty}
.blank{display:inline-block;min-width:58px;border-bottom:4px solid var(--primary);margin:0 3px;transform:translateY(2px)}
.tstack{position:relative;margin:12px 4px 26px}
.tstack::before{content:"";position:absolute;inset:14px -6px -10px 10px;border-radius:28px;background:var(--primary-l);transform:rotate(3.5deg)}
.tcard{position:relative;display:flex;flex-direction:column;gap:18px;min-height:230px;justify-content:space-between;padding:22px;border-radius:28px;background:var(--surface);box-shadow:var(--sh-lg);transition:transform .3s ease,background .2s}
.tcard .tq{margin:0;font:600 28px/1.2 var(--display)}
.tcard.r{transform:rotate(5deg) translateX(12px)}
.tcard.l{transform:rotate(-5deg) translateX(-12px)}
.tcard.ok{background:var(--mint-l)}
.tcard.no{background:var(--coral-l)}
.opts{display:grid;gap:12px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 18px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);font:700 18px/1.25 var(--body);transition:transform .1s ease-out,box-shadow .1s ease-out,background .15s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt:hover:not(:disabled){background:var(--soft)}
.opt kbd{display:grid;place-items:center;width:28px;height:28px;border:2px solid var(--line);border-radius:9px;font:800 14px/1 var(--body);color:var(--muted);flex:none}
.tf .opt{justify-content:center;min-height:68px;font:600 21px/1 var(--display)}
.tf .opt[data-v="0"]{background:var(--coral-l);border-color:var(--coral-s);color:var(--bad-ink)}
.tf .opt[data-v="1"]{background:var(--mint-l);border-color:var(--mint-s);color:var(--good-ink)}
.opt.sel,.opt.sel:hover:not(:disabled){background:var(--primary-l);border-color:var(--primary);box-shadow:0 4px 0 var(--primary);color:var(--ink)}
.tf .opt.sel{outline:3px solid var(--primary);outline-offset:3px}
.opts+.btn,.tf+.btn{margin-top:18px}
.pickhint{margin-top:10px;text-align:center}
.opt.right,.tf .opt.right{background:var(--mint-l);border-color:var(--mint);box-shadow:none;color:var(--good-ink)}
.opt.right::after,.opt.wrong::after{margin-left:auto;font:700 20px/1 var(--display)}
.opt.right::after{content:"✓"}
.opt.wrong::after{content:"✗"}
.tf .opt.right::after,.tf .opt.wrong::after,.match .opt::after{content:none}
.opt.wrong,.tf .opt.wrong{background:var(--coral-l);border-color:var(--coral);box-shadow:none;color:var(--bad-ink);animation:shake .35s}
.opt:disabled:not(.right):not(.wrong){opacity:.55;box-shadow:none}
@media (hover:none){.opt kbd{display:none}}
.typer{display:grid;gap:14px}
.typer input{width:100%;min-height:60px;padding:12px 18px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);color:var(--ink);font:700 21px/1.2 var(--body)}
.typer input:focus{outline:none;border-color:var(--primary)}
.typer input.right{background:var(--mint-l);border-color:var(--mint)}
.typer input.wrong{background:var(--coral-l);border-color:var(--coral);animation:shake .35s}
.slot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:72px;padding:10px 0 14px;margin-bottom:18px;border-bottom:3px dashed var(--line)}
.slot .hint{color:var(--muted);font-size:15px;font-weight:700}
.slot .punct{font:700 26px/1 var(--display);margin-left:-2px}
.bank{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px;min-height:50px}
.word{padding:11px 15px;border:2px solid var(--line);border-radius:15px;background:var(--surface);box-shadow:0 4px 0 var(--line);font:800 17px/1.2 var(--body);animation:pop .16s}
.word:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.word.used{opacity:.25;box-shadow:none;animation:none}
#ord.locked{pointer-events:none}
#ord.right .slot .word{background:var(--mint-l);border-color:var(--mint);box-shadow:none}
#ord.wrong .slot .word{background:var(--coral-l);border-color:var(--coral);box-shadow:none}
#ord.wrong .slot{animation:shake .35s}
.listen{display:flex;gap:10px;margin:10px 0 20px}
.fb{display:grid;gap:8px;margin-top:22px;padding:18px;border-radius:var(--r-lg);animation:rise .22s}
.fb.ok{background:var(--mint-l);color:var(--good-deep)}
.fb.no{background:var(--coral-l);color:var(--bad-deep)}
.fb-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:700 25px/1 var(--display)}
.fb-h .plus{font:800 14px/1 var(--body);padding:6px 11px;border-radius:99px;background:var(--surface);color:var(--ink)}
.fb .btn{margin-top:6px}
.fb.ok .btn{background:var(--mint);box-shadow:0 5px 0 var(--mint-d);color:#fff}
.fb.no .btn{background:var(--coral);box-shadow:0 5px 0 var(--coral-d);color:#fff}
.skip{margin-top:14px}

/* ---------- result ---------- */
.res-top{display:flex;gap:20px;align-items:center;margin:14px 0 8px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats3 div{padding:12px 14px;border-radius:20px;background:var(--surface);box-shadow:var(--sh)}
.stats3 div:nth-child(1){background:var(--sun-l);box-shadow:0 4px 0 var(--sun-s)}
.stats3 div:nth-child(2){background:var(--coral-l);box-shadow:0 4px 0 var(--coral-s)}
.stats3 dt{font:800 12.5px/1.2 var(--body);color:var(--muted)}
.stats3 dd{font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.missed{list-style:none;display:grid;gap:10px}
.missed li{padding:14px 16px;border-radius:20px;background:var(--surface);box-shadow:var(--sh)}
.missed b{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:10px;background:var(--mint-l);color:var(--good-deep)}
.missed small{display:block;color:var(--muted);font-size:14px;margin-top:6px}
.newbadge{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:22px;background:var(--sun-l);box-shadow:0 4px 0 var(--sun-s);animation:pop .4s}
.newbadge .ic{width:44px;height:44px;padding:10px;border-radius:50%;background:var(--sun);color:var(--ink)}
.newbadge b{display:block;font:600 18px/1.15 var(--display)}
.newbadge span{font-size:14px;font-weight:700;color:var(--muted)}

/* ---------- match ---------- */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .opt{justify-content:center;text-align:center;min-height:64px;padding:10px}
.match .opt.sel{background:var(--primary-l);border-color:var(--primary);box-shadow:0 4px 0 var(--primary)}
.match .opt.gone{opacity:.35;background:var(--mint-l);border-color:var(--mint);box-shadow:none}

/* ---------- flashcards ---------- */
.flip{perspective:1000px;margin:10px 0}
.flip-in{position:relative;display:block;width:100%;min-height:250px;transform-style:preserve-3d;transition:transform .45s}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;border-radius:28px;background:var(--surface);box-shadow:var(--sh-lg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.b{transform:rotateY(180deg);background:var(--lv)}
.face .w{font:700 40px/1.1 var(--display);text-wrap:balance}
.face .hint{font-size:14px;font-weight:700;color:var(--muted)}
.face.b .hint,.face.b .eyebrow{color:var(--sub-ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- profile ---------- */
.rank{display:grid;gap:10px}
.bar{height:14px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--sun)}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.statgrid div{padding:14px 16px;border-radius:20px;background:var(--surface);box-shadow:var(--sh)}
.statgrid div:nth-child(4n+1){background:var(--sun-l);box-shadow:0 4px 0 var(--sun-s)}
.statgrid div:nth-child(4n+2){background:var(--coral-l);box-shadow:0 4px 0 var(--coral-s)}
.statgrid div:nth-child(4n+3){background:var(--lilac-l);box-shadow:0 4px 0 var(--lilac-s)}
.statgrid div:nth-child(4n){background:var(--mint-l);box-shadow:0 4px 0 var(--mint-s)}
.statgrid dt{font:800 12.5px/1.2 var(--body);color:var(--muted)}
.statgrid dd{font:700 32px/1.1 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:12px;border:2px dashed var(--dash);border-radius:20px;color:var(--muted)}
.badge .bi{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--soft);font-size:18px}
.badge b{display:block;font:600 15px/1.15 var(--display)}
.badge small{font-size:12.5px;line-height:1.3;display:block;font-weight:700}
.badge.on{border:2px solid transparent;background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.badge.on .bi{background:var(--sun);color:var(--ink)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-bottom:2px solid var(--soft)}
.setting:last-child{border-bottom:0}
.setting .seg{min-width:210px}
.setting input[type=text]{min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:700 16px var(--body)}
.setting input[type=text]:focus{outline:none;border-color:var(--primary)}
.switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:800}
.switch input{appearance:none;-webkit-appearance:none;width:54px;height:32px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(36,38,74,.25);transition:transform .15s}
.switch input:checked{background:var(--mint)}
.switch input:checked::after{transform:translateX(22px)}

/* ---------- reading / speaking / welcome / transfer ---------- */
.report{justify-self:start;display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:700;color:inherit}
.reading p{margin-bottom:14px;font-size:17.5px;line-height:1.75}
.reading p:last-child{margin-bottom:0}
.ctx{margin-bottom:16px;padding:12px 16px;border-radius:18px;background:var(--surface);box-shadow:var(--sh)}
.ctx summary{font-weight:800;cursor:pointer;min-height:28px;color:var(--primary-d)}
.ctx p{margin-top:8px;font-size:15px;line-height:1.6}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots button{position:relative;width:48px;height:44px}
.dots button::before{content:"";position:absolute;left:3px;right:3px;top:13px;height:18px;border-radius:99px;background:var(--line)}
.dots button.ok::before{background:var(--mint)}
.dots button.ok::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font:800 12px/1 var(--body);color:#fff}
.dots button.cur::before{background:var(--sun);box-shadow:0 3px 0 var(--sun-d)}
.tcard.say{min-height:200px;background:var(--surface)}
.tcard.say.ok{background:var(--mint-l)}
.tcard.say.no{background:var(--coral-l)}
.welcome{padding-top:8px}
.welcome h1{font-size:36px}
.perks{list-style:none;display:grid;gap:12px}
.perks li{display:grid;grid-template-columns:46px 1fr;gap:14px;align-items:start;padding:14px 16px;border-radius:22px;background:var(--surface);box-shadow:var(--sh)}
.perks li .ic{width:46px;height:46px;padding:11px;border-radius:16px;background:var(--primary);color:#fff}
.perks li:nth-child(2) .ic{background:var(--coral)}
.perks li:nth-child(3) .ic{background:var(--mint)}
.goals{display:grid;gap:12px}
.goal{display:flex;flex-direction:column;gap:4px;width:100%;padding:16px 18px;border:2px solid transparent;border-radius:22px;background:var(--surface);text-align:left}
.goal b{font:600 22px/1.15 var(--display)}
.goal span{font-weight:700;color:var(--muted)}
.goal.on{border-color:var(--primary);background:var(--primary-l)}
.namefield{width:100%;min-height:60px;padding:12px 18px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);color:var(--ink);font:700 22px/1.2 var(--body)}
.namefield:focus{outline:none;border-color:var(--primary)}
textarea{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:500 14px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical;word-break:break-all}
textarea:focus{outline:none;border-color:var(--primary)}


/* ---------- kartu bagikan / sertifikat ---------- */
.btn.sun{background:var(--sun);color:#24264a;box-shadow:0 5px 0 var(--sun-d)}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(20,22,41,.55);animation:fade .2s}
.sheet{display:flex;flex-direction:column;gap:12px;width:min(520px,100%);max-height:100%;overflow:auto;padding:18px;border-radius:28px;background:var(--surface);box-shadow:0 8px 0 var(--line);animation:rise .25s}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-size:24px}
.cardimg{position:relative;display:grid;place-items:center;border-radius:18px;background:var(--soft);aspect-ratio:4/5;max-height:52dvh;overflow:hidden}
.cardimg img{width:100%;height:100%;object-fit:contain;-webkit-touch-callout:default}
.cardimg .spin{position:absolute;width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--primary);animation:spin .8s linear infinite;display:none}
.modal.busy .spin{display:block}
.cname{display:grid;gap:6px}
.cname label{font-weight:800;font-size:14px;color:var(--muted)}
.cname .namefield{min-height:52px;font-size:18px;padding:10px 14px}
.sheet .pair a.btn{text-decoration:none}
body.modal-open{overflow:hidden}
.certs{display:grid;gap:10px}
.cert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:20px;background:var(--surface);box-shadow:var(--sh);text-align:left;min-height:64px}
.cert .roundel{background:var(--lv)}
.cert b{display:block;font:600 18px/1.2 var(--display)}
.cert small{color:var(--muted);font-weight:700}
.cert .ic{width:28px;height:28px;color:var(--ldk)}
.tool .tic.txt{background:var(--lv);color:var(--ink);font:700 17px/1 var(--display)}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:12px 16px;border-radius:16px;background:#24264a;color:#fff;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:rise .2s}
.toast button{min-height:44px;padding:0 6px;color:#ffc845;font-weight:800}
@keyframes hop{0%{transform:translateY(0) scale(.9)}40%{transform:translateY(-8px) scale(1.05)}100%{transform:none}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}60%{transform:rotate(5deg)}}
@keyframes boom{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,200,69,.7)}100%{box-shadow:0 0 0 12px rgba(255,200,69,0)}}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-2deg)}90%{transform:rotate(2deg)}95%{transform:rotate(-1deg)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.skbar{display:block;height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.skbar i{display:block;height:100%;border-radius:99px;background:var(--ldk,var(--primary))}
.skbar.none{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,var(--line) 6px 8px)}
.setrow{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:14px 16px;border-radius:22px;background:var(--surface);box-shadow:var(--sh);text-align:left;transition:transform .1s ease-out,box-shadow .1s ease-out}
.setrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.setrow>.ic{width:26px;height:26px;color:var(--primary);flex:none}
:root[data-theme="dark"] .setrow>.ic{color:#c9c9ff}
.setrow>.ic:last-child{width:20px;height:20px;color:var(--muted)}
.setrow b{display:block;font:600 19px/1.2 var(--display)}
.setrow small{color:var(--muted);font-weight:700;font-size:14px}
.stars{display:inline-flex;gap:1px;flex:none;font-size:16px;line-height:1;letter-spacing:0}
.stars i{font-style:normal;color:var(--muted)}
.stars i.on{color:var(--xp-ink)}

/* ================= tambahan English for Kids ================= */
html,body{min-height:100%}
body{background:var(--bg) radial-gradient(circle at 8% 0%,#fff6d9 0,transparent 38%) no-repeat}
.mark{background:var(--sun);box-shadow:0 3px 0 var(--sun-d);overflow:hidden}
.chip .bone{width:18px;height:18px;color:#b98a4a}
.chip.fos{color:var(--xp-ink)}
.rexi{flex:none;display:block}
.rexi.wave{animation:wave 2.6s ease-in-out infinite;transform-origin:50% 90%}
.rexi.hop{animation:hop .5s ease-out}
.rexi.tilt{animation:tilt .6s ease-out}

/* gambar: emoji / warna / tulisan / bentuk */
.pic{display:grid;place-items:center;--ps:64px;line-height:1}
.pic-e{font-size:var(--ps);line-height:1.05;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pic-c{display:block;width:var(--ps);height:var(--ps);border-radius:50%;background:var(--c);box-shadow:inset -10px -12px 0 rgba(0,0,0,.13),inset 8px 8px 0 rgba(255,255,255,.28)}
.pic-t{font:700 calc(var(--ps) * .72)/1 var(--display);color:var(--primary-d);white-space:nowrap}
.pic svg{width:var(--ps);height:var(--ps)}

/* beranda */
.greet .say b{font-size:24px}
.cont .t{font-size:32px}
.egg{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:18px;background:var(--soft);text-align:left;min-height:64px}
.egg .ee{font-size:34px;line-height:1;flex:none}
.egg b{display:block;font-weight:800}
.egg small{color:var(--muted);font-weight:700;font-size:13px}
.egg.ready{background:var(--sun-l);box-shadow:0 4px 0 var(--sun-s);animation:wiggle 1.4s ease-in-out infinite}
.egg.ready:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-s);animation:none}
.tile .tic{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:var(--ti);color:#fff}
.tile .tic .ic{width:24px;height:24px;padding:0;background:none;border-radius:0}
.lv-h .roundel{color:var(--ldk)}
.lrow .stars{margin-left:4px}
.lrow:disabled{cursor:default}
.lrow:disabled b,.lrow:disabled small{opacity:.55}
.lrow .lk{color:var(--muted);opacity:.7}
.lrow .lk .ic{width:20px;height:20px}
.lrow .pic{--ps:26px}
.lvtest{display:flex;align-items:center;gap:12px;margin:8px 16px 14px;padding:12px 14px;border-radius:18px;background:var(--lv);text-align:left;width:calc(100% - 32px)}
.lvtest b{display:block;font:600 17px/1.2 var(--display)}
.lvtest small{font-weight:700;font-size:13px;color:var(--sub-ink)}
.lvtest .ic{width:28px;height:28px;color:var(--ldk);flex:none}

/* pelajaran: kenalan kata */
.lhead{display:flex;align-items:center;gap:12px}
.lhead .roundel{background:var(--lv);color:var(--ldk)}
.lhead h1{font-size:28px}
.wgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.wgrid2{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.wgrid2{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px 14px;border-radius:24px;background:var(--surface);box-shadow:0 5px 0 var(--line);text-align:center;min-height:150px;transition:transform .1s,box-shadow .1s}
.wcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.wcard .pic{--ps:58px;height:66px}
.wcard b{font:700 21px/1.15 var(--display);color:var(--ink)}
.wcard small{font-weight:700;font-size:14px;color:var(--muted)}
.wcard .hear{display:inline-flex;align-items:center;gap:5px;font:800 12.5px/1 var(--body);color:var(--primary-d)}
.wcard .hear .ic{width:16px;height:16px}
.wcard.played{box-shadow:0 5px 0 var(--leaf)}
.slist{display:grid;gap:10px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surface);box-shadow:var(--sh);text-align:left;width:100%}
.srow .pic{--ps:34px;flex:none}
.srow b{display:block;font-weight:800;font-size:17px}
.srow span{color:var(--muted);font-size:14px;font-weight:700}
.srow .grow{flex:1;min-width:0}

/* kuis anak */
.quiz{max-width:760px}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.qtop .blocks{flex:1}
.qbody{display:grid;gap:18px}
.prompt{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:26px 26px 26px 8px;background:var(--surface);box-shadow:var(--sh-lg)}
.prompt .ptxt{flex:1;min-width:0}
.prompt .pw{display:block;font:700 34px/1.1 var(--display);overflow-wrap:anywhere}
.prompt .pq{display:block;font:700 26px/1.25 var(--display);overflow-wrap:anywhere}
.prompt .ph{display:block;margin-top:4px;font-size:15.5px;font-weight:700;color:var(--muted)}

.pwrap .prompt{flex:1;min-width:0}
.spkbig{display:grid;place-items:center;flex:none;width:72px;height:72px;border-radius:50%;background:var(--primary);box-shadow:0 5px 0 var(--primary-d);color:#fff;transition:transform .1s,box-shadow .1s}

.bigpic{display:grid;place-items:center;padding:20px;border-radius:28px;background:var(--surface);box-shadow:var(--sh-lg)}

.popt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:148px;padding:12px;border:4px solid transparent;border-radius:26px;background:var(--surface);box-shadow:0 5px 0 var(--line);transition:transform .1s,box-shadow .1s,background .15s,border-color .15s}
.popt .pic{--ps:78px}
.popt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.popt.sel{border-color:var(--primary);background:var(--primary-l);box-shadow:0 5px 0 var(--primary)}
.popt.right{border-color:var(--mint);background:var(--mint-l);box-shadow:none}
.popt.wrong{border-color:var(--coral);background:var(--coral-l);box-shadow:none;animation:shake .35s}
.popt:disabled:not(.right):not(.wrong){opacity:.45;box-shadow:none}
.popt .lab{font:700 20px/1.1 var(--display)}
.optgrid.two .popt{min-height:120px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tgrid .opt{justify-content:center;text-align:center;min-height:72px;font:600 22px/1.15 var(--display)}
.tgrid.long .opt{font:700 18px/1.25 var(--body)}
.opt.right::after,.opt.wrong::after{content:none}
.lockbtn .ic{width:22px;height:22px}
.fb .ans{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.7)}
.fb .ans .pic{--ps:44px;flex:none}
.fb .ans b{display:block;font:700 22px/1.15 var(--display)}
.fb .ans span{font-weight:700;font-size:15px}
.fb .ans .grow{flex:1;min-width:0}
.fb-top{display:flex;gap:12px;align-items:center}
.fb-top .fb-h{flex:1}
.sentence{font:700 26px/1.35 var(--display)}
.sentence .blank{min-width:80px}
.slot .word,.bank .word{font:700 19px/1.2 var(--display)}
@media (min-width:1000px) and (orientation:landscape){
  .quiz{max-width:1120px}
  .qbody.split{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);align-items:start;gap:24px}
  .qbody.split .qside{position:sticky;top:12px}
}
@media (max-width:420px){.popt{min-height:126px}.popt .pic{--ps:62px}.prompt .pw{font-size:29px}.prompt .pq{font-size:22px}.prompt .pic{--ps:70px}.spkbig{width:62px;height:62px}.bigpic .pic{--ps:104px}.sentence{font-size:22px}}

/* hasil */
.res{max-width:640px;margin:0 auto}
.res .bigstars{display:flex;gap:6px;justify-content:center;font-size:54px;line-height:1}
.res .bigstars i{font-style:normal;color:var(--line)}
.res .bigstars i.on{color:var(--sun);text-shadow:0 3px 0 var(--sun-d);animation:pop .4s backwards}
.res .bigstars i.on:nth-child(2){animation-delay:.15s}.res .bigstars i.on:nth-child(3){animation-delay:.3s}
.res-h{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.missed .pic{--ps:32px;display:inline-grid;vertical-align:middle;margin-right:6px}

/* kartu balik, cocokkan, ucapkan */
.flip-in{min-height:min(52dvh,380px)}
.face .pic{--ps:120px}
.face .w{font-size:44px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:10px}
.mbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:76px;padding:8px 12px;border:3px solid transparent;border-radius:22px;background:var(--surface);box-shadow:0 4px 0 var(--line);font:600 21px/1.15 var(--display);text-align:center}
.mbtn .pic{--ps:48px}
.mbtn.sel{border-color:var(--primary);background:var(--primary-l);box-shadow:0 4px 0 var(--primary)}
.mbtn.gone{opacity:.35;background:var(--mint-l);box-shadow:none;border-color:var(--mint)}
.mbtn.no{animation:shake .35s;border-color:var(--coral)}
.saycard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 18px;border-radius:30px;background:var(--surface);box-shadow:var(--sh-lg);text-align:center}
.saycard .pic{--ps:120px}
.saycard b{font:700 40px/1.1 var(--display)}
.saycard.ok{background:var(--mint-l)}
.saycard.no{background:var(--coral-l)}
.micbtn{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--coral);box-shadow:0 6px 0 var(--coral-d);color:#fff}
.micbtn .ic{width:42px;height:42px}
.micbtn.on{animation:pulse 1s infinite;background:var(--bad-ink)}
.heard{font-weight:800;color:var(--muted)}

/* lagu & cerita */
.clines{display:grid;gap:10px}
.cline{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:20px;background:var(--surface);box-shadow:var(--sh);text-align:left;width:100%;transition:background .2s,transform .2s}
.cline b{display:block;font:600 21px/1.3 var(--display)}
.cline span{display:block;color:var(--muted);font-weight:700;font-size:14.5px;margin-top:2px}
.cline.now{background:var(--sun-l);box-shadow:0 4px 0 var(--sun-s);transform:scale(1.02)}
.clap{display:flex;align-items:center;justify-content:center;gap:12px;min-height:76px;border-radius:24px;background:var(--leaf);box-shadow:0 5px 0 var(--leaf-d);color:#fff;font:700 24px/1 var(--display);width:100%}
.clap .em{font-size:38px;line-height:1;display:inline-block}
.clap.hit .em{animation:boom .3s}
.page{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 20px;border-radius:30px;background:var(--surface);box-shadow:var(--sh-lg);text-align:center;min-height:min(56dvh,440px);justify-content:center}
.page .pic{--ps:140px}
.page p{font:700 30px/1.3 var(--display);text-wrap:balance}
.page .tr{font:700 17px/1.4 var(--body);color:var(--muted)}
.pgdots{display:flex;justify-content:center;gap:8px}
.pgdots i{width:12px;height:12px;border-radius:99px;background:var(--line)}
.pgdots i.on{width:30px;background:var(--primary)}
.lst{display:grid;gap:12px}
@media (min-width:760px){.lst{grid-template-columns:1fr 1fr}}
.lst .tool .tic{background:var(--lv,var(--sun-l));color:var(--ink)}
.lst .tool .tic .pic{--ps:28px}

/* profil: stiker & lencana */
.stk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (min-width:560px){.stk{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (min-width:900px){.stk{grid-template-columns:repeat(8,minmax(0,1fr))}}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:18px;background:var(--surface);box-shadow:0 4px 0 var(--line);min-height:96px;text-align:center}
.st .em{font-size:38px;line-height:1.1}
.st small{font:800 11.5px/1.2 var(--body)}
.st.off{background:var(--soft);box-shadow:none}
.st.off .em{filter:grayscale(1) brightness(1.6) opacity(.35)}
.st.off small{color:var(--muted)}
.badge .bi .ic{width:22px;height:22px}
.badge.on .bi{background:var(--sun);color:#33281a}
.prof{display:flex;align-items:center;gap:16px}
.prof h1{font-size:30px;overflow-wrap:anywhere}
.ptab{display:grid;gap:16px}
@media (min-width:920px){.ptab{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.parentgate{max-width:480px;margin:0 auto}
.parentgate input{text-align:center;font-size:30px}
.lvp{display:grid;gap:12px}
.lvp-r{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center}
.lvp-r .roundel{background:var(--lv);color:var(--ldk)}
.lvp-r .skbar i{background:var(--ldk)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.week i{display:block;width:100%;max-width:34px;border-radius:10px 10px 4px 4px;background:var(--primary-l);min-height:6px}
.week i.hit{background:var(--leaf)}
.week span{font:800 12px/1 var(--body);color:var(--muted)}
.week em{font:800 12px/1 var(--body);font-style:normal}
.grades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grades{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grade{display:flex;flex-direction:column;gap:2px;padding:14px;border:3px solid transparent;border-radius:20px;background:var(--surface);box-shadow:var(--sh);text-align:left;min-height:72px}
.grade b{font:600 20px/1.1 var(--display)}
.grade span{font-weight:700;font-size:13.5px;color:var(--muted)}
.grade.on{border-color:var(--primary);background:var(--primary-l);box-shadow:0 4px 0 var(--primary)}
.welcome-hero{display:flex;align-items:center;gap:16px}
.welcome-hero h1{font-size:34px}
.hatch{display:grid;place-items:center;gap:8px;text-align:center}
.hatch .big{font-size:96px;line-height:1;animation:pop .5s}
.danger{color:var(--bad-ink)}
.btn.leaf{background:var(--leaf);box-shadow:0 5px 0 var(--leaf-d);color:#fff}
.btn.leaf:active:not(:disabled){box-shadow:0 1px 0 var(--leaf-d)}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
body.sub .top,body.sub .nav{display:none}
body.sub .shell{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-top:calc(14px + env(safe-area-inset-top,0px))}
.ptab .badges{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}


/* ================= TEMA P4 · HUTAN PASTEL =================
   Langit ungu muda ke peach, bukit mint, tanpa garis hitam, sudut bulat, bayangan lembut. Fredoka + Nunito. */
:root{
  --bg:#f3eeff; --surface:#ffffff; --soft:#f1fbf6; --line:#e7e1f6;
  --ink:#2f3a3a; --muted:#566563;
  --primary:#2f9e68; --primary-d:#1f7a4e; --primary-l:#e1f7ea;
  --grad:linear-gradient(135deg,#24905c 0%,#3eae76 100%);
  --sun:#ffd36e; --sun-d:#e0a83a; --sun-l:#fff4d1; --sun-s:#f6e2a8;
  --coral:#ff8a6b; --coral-d:#d9603f; --coral-l:#ffe6dd; --coral-s:#f8cfc2;
  --mint:#3cc489; --mint-d:#26a36d; --mint-l:#ddf6ea; --mint-s:#bfe9d4;
  --leaf:#2f9e68; --leaf-d:#1f7a4e; --leaf-l:#e1f7ea;
  --sky:#3a8ee6; --sky-l:#e3f0ff;
  --lilac:#7d61e8; --lilac-l:#efe9ff; --lilac-s:#dcd2fb;
  --sh:0 6px 0 rgba(125,97,232,.10),0 10px 22px rgba(47,58,58,.08);
  --sh-lg:0 8px 0 rgba(125,97,232,.12),0 14px 28px rgba(47,58,58,.10);
  --r:24px; --r-lg:30px;
  --display:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --good-ink:#17734a; --good-deep:#115a39; --bad-ink:#b2472a; --bad-deep:#8a3219;
  --sub-ink:#2f3a3a; --xp-ink:#8a6400; --dash:#cfc6ec;
}
body{background:linear-gradient(180deg,#e7dcff 0,#f4e8ff 220px,#ffe9df 480px,#f2fbf5 100%) fixed;font-weight:700}
.scene{position:fixed;left:0;right:0;bottom:0;z-index:-1;pointer-events:none;height:40vh;min-height:200px}
.scene svg,.sky svg{width:100%;height:100%;display:block}
.sky{position:fixed;inset:0 0 auto 0;height:220px;z-index:-1;pointer-events:none}
.shell{position:relative}
h1{font-weight:700;color:var(--ink)}
h2{font-weight:600;font-size:24px}
.eyebrow{font-weight:800;color:var(--muted)}
.muted{color:var(--muted);font-weight:700}

/* permukaan lembut */
.card,.chip,.nav,.tile,.cont,.lvcard,.tool,.setrow,.opt,.popt,.wcard,.srow,.prompt,.bigpic,.greet .say,.egg,.grade,.stats3 div,.statgrid div,.badge.on,.st,.mbtn,.saycard,.page,.cline,.iconbtn,.sheet,.face,.missed li,.word,.namefield,.typer input,textarea{border:0;box-shadow:var(--sh)}
.card,.cont,.lvcard,.page,.saycard,.sheet{box-shadow:var(--sh-lg);border-radius:var(--r-lg)}
.tile:active:not(:disabled),.tool:active:not(:disabled),.setrow:active,.opt:active:not(:disabled),.popt:active:not(:disabled),.wcard:active,.egg.ready:active,.mbtn:active,.word:active:not(:disabled),.iconbtn:active,.grade:active,.cont:active{transform:translateY(3px) scale(.99);box-shadow:0 2px 0 rgba(125,97,232,.12),0 4px 10px rgba(47,58,58,.08)}
.opt,.namefield,.typer input,textarea{border:2px solid var(--line)}
.st.off,.tool:disabled,.badge{box-shadow:none}

/* tombol */
.btn{background:var(--grad);color:#fff;box-shadow:0 6px 0 rgba(31,122,78,.30),0 10px 20px rgba(47,158,104,.20);font:600 21px/1.1 var(--display);min-height:60px;border-radius:22px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(31,122,78,.30)}
.btn.good,.btn.leaf{background:linear-gradient(135deg,#2fb57a,#5ccf96);box-shadow:0 6px 0 rgba(31,122,78,.30)}
.btn.bad{background:linear-gradient(135deg,#e0603f,#ff8a6b);box-shadow:0 6px 0 rgba(178,71,42,.30)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.btn.good:active:not(:disabled),.btn.bad:active:not(:disabled),.btn.ghost:active:not(:disabled),.btn.leaf:active:not(:disabled){box-shadow:0 2px 0 rgba(0,0,0,.10)}
.btn:disabled{background:#ece8f6;color:#6f6a85;box-shadow:none}
.spkbig{background:var(--grad);box-shadow:0 6px 0 rgba(31,122,78,.30)}
.spkbig:active{box-shadow:0 2px 0 rgba(31,122,78,.30)}
.micbtn{background:linear-gradient(135deg,#e9558f,#ff8ab3);box-shadow:0 6px 0 rgba(184,51,110,.30)}
.spk{background:var(--lilac-l);color:var(--lilac)}

/* bilah atas & menu */
.brand{font:700 25px/1 var(--display)}
.mark{border-radius:16px;width:48px;height:48px;box-shadow:var(--sh)}
.chip{background:#fff;padding:8px 13px;font:900 16px/1 var(--body)}
.chip.fos{color:var(--xp-ink)}
.nav{padding:7px;box-shadow:0 8px 0 rgba(125,97,232,.12),0 14px 30px rgba(47,58,58,.14)}
.nav button{height:52px;font:900 16px/1 var(--body);color:var(--muted)}
.nav button[aria-current="page"]{background:var(--grad);color:#fff}

/* beranda */
.greet .rexi{margin-bottom:-4px}
.greet .say{border-radius:28px 28px 28px 8px;padding:14px 18px}
.greet .say b{font:700 28px/1.1 var(--display);color:var(--primary)}
.greet .say span{font-weight:800;font-size:16px;color:var(--muted)}
.cont{position:relative;overflow:hidden;background:var(--grad);padding:22px}
.cont::before{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.16)}
.cont::after{content:"";position:absolute;right:140px;bottom:-40px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)}
.cont>*{position:relative;z-index:1}
.cont .t{font:700 38px/1.02 var(--display);text-shadow:0 2px 8px rgba(0,0,0,.15)}
.cont .tag{background:rgba(255,255,255,.25);font-weight:900}
.cont .play{width:78px;height:78px;border:5px solid rgba(255,255,255,.85);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.cont .play .ic{width:32px;height:32px}
.cont .pbar{height:14px;background:rgba(255,255,255,.35)}
.cont small{font-weight:900}
.pbar{background:#ede8fb}
.mrow .pbar{height:10px}
.mrow .pbar i{background:#ff8a4c}
.mbox{border:0;background:var(--soft);box-shadow:inset 0 0 0 3px #e3dcf6}
.mrow.done .mbox{background:var(--mint);box-shadow:none}
.mt{font-weight:800}
.tiles{gap:14px}
.tile{position:relative;overflow:hidden;min-height:128px;justify-content:space-between;padding:14px;background:var(--tc);color:var(--ink)}
.tile .tic{background:var(--ti)!important;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.tile b{position:relative;z-index:1;font:700 22px/1.05 var(--display)}
.tile small{position:relative;z-index:1;color:var(--muted);font-weight:800}
.tile .deco{position:absolute;right:-4px;bottom:-8px;font-size:60px;line-height:1;transform:rotate(-10deg)}
.egg{background:#fff6d6;box-shadow:none}
.egg.ready{box-shadow:0 6px 0 var(--sun-s);background:var(--sun-l)}
.egg .ee{font-size:40px}
.secthead{background:rgba(255,255,255,.7);border-radius:18px;padding:6px 14px}
.secthead h2{font-size:25px}
.lv-h{min-height:80px}
.lv-n{font:700 21px/1.1 var(--display)}
.lv-s{font-weight:800}
.lvbar{height:10px;background:rgba(255,255,255,.75)}
.roundel{box-shadow:0 3px 0 rgba(0,0,0,.06);font-weight:700}
.chev{background:rgba(255,255,255,.8)}
.lrow{border-bottom:2px dashed #ece6f8}
.lrow b{font-weight:900}
.lrow .n{border:3px solid #fff;background:var(--soft);box-shadow:0 3px 0 rgba(0,0,0,.06);color:var(--muted)}
.lrow.done .n{background:var(--mint);border-color:#fff;color:#fff}
.lrow.cur{background:var(--sun-l)}
.lrow.cur .n{background:var(--sun);border-color:#fff;color:var(--ink)}
.lrow .go{background:var(--grad);font-weight:900;font-size:14px;padding:9px 15px}
.stars i.on{color:#f5b400}
.lvcard.cur{box-shadow:var(--sh-lg),0 0 0 4px var(--sun)}
.lvtest{box-shadow:none}

/* pelajaran & kuis */
.lhead .roundel{width:56px;height:56px}
.wcard{min-height:160px}
.wcard b{font:700 24px/1.05 var(--display)}
.wcard .pic{--ps:64px;height:72px}
.wcard.played{background:var(--mint-l)}
.prompt{border-radius:30px 30px 30px 8px}
.prompt .pw{font:700 42px/1 var(--display)}
.prompt .pq{font:700 30px/1.1 var(--display)}
.prompt .ph{font-weight:800}
.blocks{gap:5px}
.blocks span{height:14px;background:#fff;box-shadow:inset 0 0 0 2px #e3dcf6}
.blocks span.ok{background:var(--mint);box-shadow:none}
.blocks span.cur{background:var(--sun);box-shadow:none}
.blocks span.no{background:var(--coral);box-shadow:none}
.prog{background:#fff;height:14px;box-shadow:inset 0 0 0 2px #e3dcf6}
.prog i{background:var(--grad)}
.qcount{font-weight:900;color:var(--ink);background:#fff;border-radius:99px;padding:6px 11px;box-shadow:var(--sh)}
.combo{background:var(--sun);color:var(--ink)}
.popt{border:0;border-radius:28px}
.popt.sel{background:var(--primary-l);box-shadow:0 0 0 5px var(--primary),0 10px 20px rgba(47,158,104,.18);transform:scale(1.03)}
.popt.right{background:var(--mint-l);box-shadow:0 0 0 5px var(--mint)}
.popt.wrong{background:var(--coral-l);box-shadow:0 0 0 5px var(--coral)}
.popt .lab{font:700 22px/1 var(--display)}
.opt{font-weight:800}
.tgrid .opt{font:700 24px/1.1 var(--display)}
.opt.sel,.opt.sel:hover:not(:disabled){border-color:var(--primary);background:var(--primary-l);box-shadow:0 0 0 3px var(--primary)}
.opt.right{border-color:var(--mint);background:var(--mint-l);box-shadow:none}
.opt.wrong{border-color:var(--coral);background:var(--coral-l);box-shadow:none}
.pickhint{background:rgba(255,255,255,.8);border-radius:16px;padding:6px 10px}
.fb{box-shadow:var(--sh-lg);border-radius:var(--r-lg)}
.fb-h{font:700 30px/1 var(--display)}
.fb-h .plus{font-weight:900}
.fb .ans{background:#fff}
.fb.ok .btn{background:linear-gradient(135deg,#2fb57a,#5ccf96)}
.fb.no .btn{background:linear-gradient(135deg,#e0603f,#ff8a6b);box-shadow:0 6px 0 rgba(178,71,42,.3)}
.slot{border-bottom:3px dashed #d5cbf2}
.word{font-weight:800;border:0}
.sentence{font:700 30px/1.3 var(--display)}

/* hasil, permainan, profil */
.res h1{font-size:34px}
.res .bigstars{font-size:64px}
.res .bigstars i{color:#ebe5fa}
.res .bigstars i.on{color:#ffc93c;text-shadow:0 4px 0 #e0a83a}
.res-h{background:rgba(255,255,255,.85);border-radius:30px;padding:16px;box-shadow:var(--sh)}
.stats3 div:nth-child(1){background:var(--sun-l)}
.stats3 div:nth-child(2){background:var(--coral-l)}
.stats3 div:nth-child(3){background:var(--sky-l)}
.stats3 dd,.statgrid dd{font-weight:700}
.statgrid div:nth-child(4n+3){background:var(--lilac-l)}
.statgrid div:nth-child(4n){background:var(--mint-l)}
.mbtn{border:0}
.mbtn.sel{background:var(--primary-l);box-shadow:0 0 0 4px var(--primary)}
.mbtn.gone{background:var(--mint-l);box-shadow:none}
.mbtn.no{box-shadow:0 0 0 4px var(--coral)}
.mbtn{font-weight:700}
.face.b{background:var(--sun-l)!important}
.saycard b{font-weight:700;font-size:46px}
.cline.now{background:var(--sun-l)}
.clap{background:var(--grad);box-shadow:0 6px 0 rgba(31,122,78,.30)}
.page p{font:700 34px/1.25 var(--display)}
.pgdots i{background:#e3dcf6}
.pgdots i.on{background:var(--primary)}
.grade{border:0}
.grade b{font-weight:700}
.grade.on{background:var(--primary-l);box-shadow:0 0 0 4px var(--primary)}
.tool .tic{box-shadow:0 4px 0 rgba(0,0,0,.08)}
.tool b,.setrow b{font-weight:700}
.tool .meta{background:var(--lilac-l);color:var(--ink);font-weight:900}
.tool:disabled{background:rgba(255,255,255,.65)}
.badge{border:2px dashed var(--dash);background:rgba(255,255,255,.7)}
.badge.on{border:0}
.badge.on .bi{background:var(--sun)}
.st{background:#fff}
.st.off{background:rgba(255,255,255,.6)}
.bar{box-shadow:inset 0 0 0 2px #e3dcf6;height:16px;background:#fff}
.bar i{background:linear-gradient(90deg,#ff8a4c,#ffd36e)}
.prof h1,.welcome h1{font-size:36px}
.welcome-hero,.prof{background:rgba(255,255,255,.85);border-radius:30px;padding:14px 18px;box-shadow:var(--sh)}
.greet>div:not(.say){background:rgba(255,255,255,.85);border-radius:24px;padding:10px 16px;box-shadow:var(--sh)}
.back{background:#fff;border-radius:99px;padding:8px 16px 8px 10px;box-shadow:var(--sh);color:var(--ink);font-weight:900;align-self:flex-start}
.switch input:checked{background:var(--mint)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--grad);color:#fff}
.week i{background:#ede8fb}
.week i.hit{background:var(--mint)}
.skbar{background:#ede8fb}
.toast{background:#3d3566}
.modal{background:rgba(61,53,102,.45)}
.lst .tool .tic{background:var(--lv)}
.stack>h2,.sp>h2{background:rgba(255,255,255,.8);border-radius:16px;padding:2px 12px;align-self:flex-start}
@media (max-width:420px){.brand{font-size:19px;gap:8px}.chip{padding:6px 9px;font-size:14px}.cont .t{font-size:30px}.greet .say b{font-size:23px}.tile b{font-size:20px}.tile small{display:none}.tile .deco{font-size:48px;right:-4px;bottom:-6px}.tile{min-height:116px}.prompt .pw{font-size:34px}.prompt .pq{font-size:25px}.mark{width:42px;height:42px}}

function distract(item, n, fieldOk = () => true) {
 const same = LESSONS.find(l => l.id === item.lid).words.filter(o => o.w !== item.w && o.pic !== item.pic && fieldOk(o));
 let out = shuffle(same).slice(0, n);
 if (out.length < n) { const more = shuffle(VOCAB.filter(o => o.li === item.li && o.lid !== item.lid && o.w !== item.w && !out.some(z => z.w === o.w || z.pic === o.pic) && fieldOk(o))); out = out.concat(more.slice(0, n - out.length)); }
 if (out.length < n) { const more = shuffle(VOCAB.filter(o => o.w !== item.w && !out.some(z => z.w === o.w || z.pic === o.pic))); out = out.concat(more.slice(0, n - out.length)); }
 return out;
}
const UNC = ["rice", "bread", "milk", "water", "juice", "ice cream"];
const article = (it) => { const l = it.lid; if (["num", "col"].includes(l) || UNC.includes(it.w)) return it.w; return (/^[aeiou]/i.test(it.w) ? "an " : "a ") + it.w; };
function makeQ(type, it) {
 const base = { type, key: it.key, show: { pic: it.pic, w: it.w, m: it.m } };
